<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="משחק דיג בדפדפן: כנרת, ים, ירקון וירדן.">
<meta property="og:type" content="website">
<meta property="og:title" content="חכה לשבת · משחק דיג">
<meta property="og:description" content="כנרת, ים, ירקון וירדן. בחינם, בלי התקנה.">
<meta property="og:image" content="https://vizel014.github.io/hakhaleshabat/screenshots/05-yosef-mokir-shabbat.png">
<meta property="og:url" content="https://vizel014.github.io/hakhaleshabat/">
<meta name="twitter:card" content="summary_large_image">
<title>חכה לשבת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Suez+One&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed canvas water scene with a live camera; HUD as tackle-box panels pinned to the top and bottom edges. Single dark world by choice. */
:root{
  --panel:rgba(10,20,34,.88);
  --card:#0f1b2c;
  --edge:rgba(243,234,214,.18);
  --cream:#f3ead6;
  --muted:#a7b4c2;
  --bob:#ff5a36;
  --gold:#ffd75e;
  --reed:#86c98f;
  --warn:#ffb340;
  --danger:#ff4a3d;
  --display:'Suez One','Frank Ruhl Libre',Georgia,serif;
  --body:'Assistant','Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#0b1626;color:var(--cream);font-family:var(--body);direction:rtl;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#game{position:fixed;inset:0;display:block;cursor:crosshair}
.num{font-variant-numeric:tabular-nums}
.hud{position:fixed;left:16px;right:16px;display:flex;gap:12px;pointer-events:none;z-index:2}
.hud.top{top:calc(env(safe-area-inset-top,0px) + 12px);justify-content:flex-start;align-items:flex-start;flex-wrap:wrap}
.hud.bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);flex-direction:column;align-items:center}
.panel{pointer-events:auto;background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.lvl{min-width:220px;max-width:min(340px,100%)}
.lvlname{font-family:var(--display);font-size:22px;line-height:1.2;text-wrap:balance}
.goal{display:flex;justify-content:space-between;gap:16px;font-size:15px;margin-top:4px;font-weight:600}
.bar{height:6px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--reed);transition:width .35s}
.clock{display:grid;grid-template-columns:auto auto;gap:2px 18px;align-items:end}
.time{font-family:var(--display);font-size:30px;line-height:1}
.time.low{color:var(--danger)}
.score{font-family:var(--display);font-size:30px;line-height:1;display:flex;align-items:baseline;gap:6px}
.combo{font-family:var(--body);font-weight:800;font-size:14px;color:#1d0c06;background:var(--gold);border-radius:3px;padding:1px 6px}
.combo.x1{background:rgba(255,255,255,.14);color:var(--muted)}
.combo.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.5)}}
.small{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{pointer-events:auto;font:600 12px var(--body);color:var(--cream);background:rgba(255,255,255,.06);border:1px solid var(--edge);border-radius:4px;padding:3px 8px;cursor:pointer}
.chip:hover{background:rgba(255,255,255,.14)}
.hint{font-size:15px;font-weight:700;background:rgba(10,20,34,.6);padding:5px 12px;border-radius:4px;text-align:center;max-width:100%;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.hint.hot{background:var(--bob);color:#1d0c06;animation:pulse .4s infinite alternate;text-shadow:none}
@keyframes pulse{to{transform:scale(1.07)}}
.rig{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:center;max-width:100%}
.meter{flex:1 1 240px;min-width:0;max-width:340px;display:flex;flex-direction:column;gap:6px}
.meter-head{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.meter-head .num{color:var(--cream);font-weight:700}
.tbar{position:relative;height:12px;background:rgba(255,255,255,.1);border-radius:2px}
.tbar i{position:absolute;inset-block:0;inset-inline-start:0;width:0;border-radius:2px;background:var(--reed)}
.tbar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--cream)}
.tbar b.brk{background:var(--danger)}
.wear{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.wbar{flex:1;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.wbar i{display:block;height:100%;width:100%;background:var(--cream)}
.ctl{display:flex;align-items:center;gap:6px}
.ctl .lab{font-size:13px;color:var(--muted);margin-inline-end:2px}
.ctl .val{min-width:52px;text-align:center;font-weight:700;font-size:16px}
.ctl button{width:30px;height:30px;border-radius:4px;border:1px solid var(--edge);background:rgba(255,255,255,.07);color:var(--cream);font:700 18px/1 var(--body);cursor:pointer}
.ctl button:hover{background:rgba(255,255,255,.14)}
button:focus-visible,.btn:focus-visible,.loc:focus-visible{outline:2px solid var(--bob);outline-offset:2px}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 124px);left:50%;transform:translateX(-50%);z-index:3;font-family:var(--display);font-size:26px;padding:8px 18px;border-radius:4px;background:rgba(10,20,34,.85);border:1px solid var(--edge);white-space:nowrap;pointer-events:none;animation:pop .28s cubic-bezier(.2,1.6,.4,1)}
.toast.good{border-color:var(--reed)}
.toast.gold{border-color:var(--gold);color:var(--gold)}
.toast.bad{border-color:var(--danger);color:#ffd9d4;background:rgba(60,10,10,.85)}
.toast small{font-family:var(--body);font-size:15px;color:var(--muted);margin-inline-start:8px}
.toast .k{font-family:var(--body);font-size:13px;font-weight:800;border-radius:3px;padding:1px 6px;margin-inline-start:8px;vertical-align:middle;background:var(--reed);color:#0d1e10}
.toast .k.no{background:rgba(255,255,255,.15);color:var(--muted)}
@keyframes pop{from{transform:translate(-50%,-10px) scale(.7);opacity:0}}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,10,20,.5);z-index:5}
.card{background:var(--card);border:1px solid var(--edge);border-radius:8px;width:100%;max-width:520px;max-height:calc(100% - 16px);overflow:auto;padding:24px 24px 22px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.card.wide{max-width:720px}
.card h1{font-family:var(--display);font-weight:400;font-size:44px;line-height:1.05;margin:4px 0 10px;color:var(--cream)}
.card h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;margin:4px 0 8px;text-wrap:balance}
.card p{margin:0 0 14px;line-height:1.55;font-size:16px;color:#d9d2c2}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:0 0 16px;font-size:15px}
.keys dt{font-weight:700;color:var(--cream);white-space:nowrap}
.keys dd{margin:0;color:#cfc8b8;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted);margin-bottom:14px}
.meta b{color:var(--cream)}
.goalline{font-size:18px;font-weight:700;color:var(--bob);margin-bottom:10px}
.sp{display:grid;grid-template-columns:84px 1fr auto;align-items:center;gap:4px 12px;padding:6px 0;border-top:1px solid var(--edge);font-size:15px}
.sp img{width:84px;height:42px}
.sp .nm{font-weight:700}
.sp .nm em{font-style:normal;font-size:12px;font-weight:700;margin-inline-start:6px}
.sp .nm em.t{color:var(--danger)}
.sp .nm em.k{color:var(--reed)}
.sp .dd{color:var(--muted);font-size:13px;text-align:left}
.locs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:6px 0 16px}
.loc{display:flex;flex-direction:column;gap:6px;text-align:start;font:inherit;color:var(--cream);background:rgba(255,255,255,.04);border:1px solid var(--edge);border-radius:6px;padding:12px 14px;cursor:pointer;min-width:0}
.loc:hover{background:rgba(255,255,255,.09);border-color:rgba(255,90,54,.6)}
.loc .ln{font-family:var(--display);font-size:24px;line-height:1.1}
.loc .ls{font-size:14px;color:#cfc8b8;line-height:1.4}
.loc .lf{display:flex;gap:2px;flex-wrap:wrap}
.loc .lf img{width:60px;height:30px}
.loc .lb{font-size:12px;color:var(--muted);font-weight:700}
.catches{margin:0 0 14px;padding:0;list-style:none}
.catches li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid var(--edge);font-size:15px}
.catches li.g{color:var(--gold)}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-block;margin-top:6px;font:700 18px var(--body);background:var(--bob);color:#1d0c06;border:0;border-radius:4px;padding:11px 26px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--edge)}
.tip{font-size:14px;color:var(--muted);border-inline-start:3px solid var(--bob);padding-inline-start:10px;margin:0 0 16px;line-height:1.5}
.clock .chips{grid-column:1/-1}
.coins{font-weight:800;color:var(--gold);font-size:15px;justify-self:start}
.shop{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:6px 0 14px}
.up{display:flex;flex-direction:column;gap:2px;text-align:start;font:inherit;color:var(--cream);background:rgba(255,255,255,.04);border:1px solid var(--edge);border-radius:6px;padding:8px 10px;cursor:pointer;min-width:0}
.up:hover:not(:disabled){border-color:rgba(255,215,94,.7);background:rgba(255,255,255,.08)}
.up:disabled{opacity:.5;cursor:default}
.up:focus-visible{outline:2px solid var(--bob);outline-offset:2px}
.up b{font-size:15px;display:flex;justify-content:space-between;gap:6px}
.up span{font-size:12px;color:var(--muted);line-height:1.35}
.up i{font-style:normal;font-size:13px;font-weight:800;color:var(--gold)}
.album{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 14px}
.album img{width:56px;height:28px}
.album img.no{filter:brightness(0);opacity:.3}
.songrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.songrow .btn{margin:0;font-size:15px;padding:8px 16px}
.gear{width:100%;height:auto;aspect-ratio:460/120;max-width:100%;border-radius:6px;display:block;margin:6px 0 4px}
.gearnames{font-size:13px;color:var(--gold);margin:0 0 8px;line-height:1.4}
.how{list-style:none;counter-reset:s;display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px;padding:0}
.how li{counter-increment:s;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:6px;padding:8px 12px;font-size:15px}
.how li::before{content:counter(s);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--bob);color:#1d0c06;font-weight:800;font-size:13px}
.howmore{font-size:13px!important;color:var(--muted)!important;margin:0 0 14px!important}
.table-img{width:100%;height:auto;border-radius:6px;margin:4px 0 12px;display:block}
.sel{font:600 15px var(--body);background:#0b1626;color:var(--cream);border:1px solid var(--edge);border-radius:4px;padding:7px 10px;max-width:100%}
.sel:focus-visible{outline:2px solid var(--bob);outline-offset:2px}
.rotate{display:none;position:fixed;inset:0;z-index:9;background:rgba(5,10,20,.94);align-items:center;justify-content:center;text-align:center;padding:24px}
.rotate div{display:flex;flex-direction:column;gap:12px;align-items:center;max-width:320px}
.rotate b{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.2}
.rotate span{color:var(--muted);font-size:16px;line-height:1.5}
.phone{width:46px;height:78px;border:3px solid var(--cream);border-radius:9px;animation:turn 2.2s ease-in-out infinite}
@keyframes turn{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:700px){body:not(.rot-ok) .rotate{display:flex}}
@media (max-height:520px){
  .hud.top{top:calc(env(safe-area-inset-top,0px) + 6px)}
  .hud.bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 6px);gap:6px}
  .panel{padding:5px 9px}
  .lvlname{font-size:16px}.goal{font-size:13px;margin-top:2px}.eyebrow{font-size:10px}.lvl{min-width:180px}
  .time,.score{font-size:20px}.small,.coins{font-size:12px}
  .chip{padding:2px 6px;font-size:11px}
  .hint{font-size:13px;padding:3px 8px}
  .rig{gap:4px 12px}.meter{flex-basis:170px;gap:3px}.wear{display:none}
  .ctl button{width:26px;height:26px;font-size:16px}.ctl .val{min-width:40px;font-size:14px}.ctl:last-child{display:none}
  .toast{top:calc(env(safe-area-inset-top,0px) + 64px);font-size:19px}
  .card{padding:14px 16px}.card h1{font-size:30px}.card h2{font-size:22px}.card p{font-size:14px}
}
@media (max-width:560px){.shop{grid-template-columns:1fr}.lvl{min-width:0;flex:1 1 100%}.time,.score{font-size:24px}.card h1{font-size:36px}.locs{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.hint.hot,.toast,.combo.bump,.phone{animation:none}}
</style>
</head>
<body>
<canvas id="game" aria-label="מקום דיג ודייג על החוף"></canvas>

<div class="hud top">
  <section class="panel lvl">
    <div class="eyebrow" id="lvlNum">הכנרת · שלב 1 מתוך 5</div>
    <div class="lvlname" id="lvlName">שחר על המים</div>
    <div class="goal"><span id="goalTxt">תפסו 3 דגים</span><span id="goalVal" class="num">0/3</span></div>
    <div class="bar"><i id="goalBar"></i></div>
  </section>
  <section class="panel clock">
    <div class="eyebrow">ניקוד</div>
    <div class="eyebrow">עד שבת</div>
    <div class="score"><span class="num" id="scoreTxt">0</span><span class="combo x1" id="comboTxt">x1</span></div>
    <div class="time num" id="timeTxt">2:00</div>
    <div class="small" id="windTxt">רוח: שקט</div>
    <div class="coins num" id="coinTxt">0 ₪</div>
    <div class="chips"><button id="muteBtn" class="chip" type="button">צליל: פועל</button><button id="musicBtn" class="chip" type="button">מוזיקה: ניגון</button><button id="shopBtn" class="chip" type="button">חנות</button><button id="mapBtn" class="chip" type="button">מקום אחר</button></div>
  </section>
</div>

<div class="hud bottom">
  <div id="hint" class="hint">החזיקו לחוץ כדי לטעון הטלה, שחררו כדי להטיל</div>
  <section class="panel rig">
    <div class="meter">
      <div class="meter-head"><span>מתיחת חוט</span><span class="num" id="tenTxt">0.0 / 6 ק״ג</span></div>
      <div class="tbar"><i id="tenFill"></i><b id="dragMark" title="בלם"></b><b id="brkMark" class="brk" title="חוזק החוט"></b></div>
      <div class="wear"><span>מצב החוט</span><div class="wbar"><i id="wearFill"></i></div></div>
    </div>
    <div class="ctl"><span class="lab">בלם</span><button id="dragMinus" type="button" aria-label="הורד בלם">−</button><span class="num val" id="dragTxt">3.0</span><button id="dragPlus" type="button" aria-label="הגבר בלם">+</button></div>
    <div class="ctl"><span class="lab">עומק</span><button id="depMinus" type="button" aria-label="פחות עומק">−</button><span class="num val" id="depTxt">2.0 מ׳</span><button id="depPlus" type="button" aria-label="יותר עומק">+</button></div>
    <div class="ctl"><span class="lab">חוט בחוץ</span><span class="num val" id="lineTxt">0 מ׳</span></div>
  </section>
</div>

<div id="toast" class="toast" hidden></div>
<div class="rotate" id="rotate"><div><i class="phone" aria-hidden="true"></i><b>סובבו את הטלפון לרוחב</b><span>המים, הדייג והדגים נכנסים למסך הרבה יותר טוב לרוחב</span><button class="btn" id="rotateOk" type="button">להמשיך בכל זאת</button></div></div>
<div id="overlay" class="overlay"><div class="card" id="card"></div></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- units & constants ---------- */
const PX = 40;               // pixels per metre
const G = 9.8 * PX;          // gravity, px/s²
const KGF = G;               // 1 kg-force on 1 kg of mass
const DT = 1 / 240, ITER = 6;
const ALPHA = 0.003;         // line compliance (monofilament stretch)
const REEL = 190;            // reel retrieve, px/s
const ROD_LEN = 205, ROD_K = 230, ROD_C = 13, ROD_M = 0.15;
const BUOY = 3.1;            // bobber buoyancy / weight
const SHORE = 210;           // end of the pier
const M = 40;                // drawing margin for camera shake
const BEST_KEY = 'hakhaleshabat-best';
const WALLET_KEY = 'hakhaleshabat-wallet';

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const dist = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
function hexA(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
function rgba(c, a) { return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function mixHex(a, b, t) {
  const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
  const m = (s) => Math.round(lerp(x >> s & 255, y >> s & 255, t));
  return '#' + ((1 << 24) | (m(16) << 16) | (m(8) << 8) | m(0)).toString(16).slice(1);
}
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- species ----------
   look: h body height/length · top share of height above the centreline · p,q rear/nose fullness · ped peduncle
   tail type · dorsal [[from,to,height,kind]] in body units (0 = tail root, 1 = snout) · anal [from,to,height] */
const SP = {
  tilapia: { name: 'אמנון', kosher: true, kg: [0.3, 1.1], d: [1, 3.5], str: 1.2, end: 1.0, speed: 55, bite: 0.6, nib: [1, 3], app: 1.0, jump: 0.35,
    look: { h: .46, top: .56, p: 1, q: .55, ped: .2, tail: 'square', tailL: .2, dorsal: [[.14, .74, .42, 'spiny']], anal: [.12, .36, .36], col: ['#3d4c47', '#8fa39a', '#e9ede4'], fin: '#56685f', finEdge: '#b4563f', pattern: 'bars', scale: .1, eye: '#d9a43a', mouth: 'thick' } },
  mullet: { name: 'בורי', kosher: true, kg: [0.6, 2.4], d: [0.3, 2], str: 1.5, end: 1.1, speed: 80, bite: 0.5, nib: [1, 2], app: 0.9, jump: 0.6,
    look: { h: .26, top: .5, p: .8, q: .5, ped: .24, tail: 'fork', tailL: .22, dorsal: [[.56, .66, .4, 'spiny'], [.24, .36, .36, 'soft']], anal: [.2, .32, .3], col: ['#2a3d52', '#8ea4b8', '#eef2f4'], fin: '#5d7088', pattern: 'stripes', scale: .13, eye: '#cfd6dc' } },

/* ---------- physics (position based, fixed step) ---------- */
function integ(p, ax, ay, kx, ky, dt) {
  let vx = (p.x - p.px) / dt, vy = (p.y - p.py) / dt;
  vx = (vx + ax * dt) * Math.exp(-kx * dt);
  vy = (vy + ay * dt) * Math.exp(-ky * dt);
  p.px = p.x; p.py = p.y; p.x += vx * dt; p.y += vy * dt;

  a.x += dx * k * a.w; a.y += dy * k * a.w;
  b.x -= dx * k * b.w; b.y -= dy * k * b.w;

    setP(bob, hook.x + dx * k, hook.y + dy * k);
  }
}

/* ---------- fish ---------- */
function pickSpecies() {
  const hasBoss = fishes.some(f => SP[f.sp].boss);
  const ent = Object.entries(LV.pool).filter(e => !(hasBoss && SP[e[0]].boss));
  const tot = ent.reduce((a, e) => a + e[1], 0);
  let r = Math.random() * tot;
  for (const [k, w] of ent) { if ((r -= w) <= 0) return k; }
  return ent[0][0];
}
function fishXMax() { return Math.min(VW, farX) - 60; }
function pickTarget(f) {
  const sp = SP[f.sp];
  const x = rand(SHORE + 110, fishXMax());
  f.tx = x;
  f.ty = clamp(SURF + rand(sp.d[0], sp.d[1]) * PX, SURF + 14, bottomAt(x) - 10);
}
function makeFish(spk) {
  const sp = SP[spk];
  const kg = sp.kg[0] + (sp.kg[1] - sp.kg[0]) * Math.pow(Math.random(), 1.8);
  return { sp: spk, kg, len: (18 + 38 * Math.cbrt(kg)) * (sp.long || 1), x: 0, y: 0, vx: 0, vy: 0, st: 'swim', t: 0, ph: rand(0, 6), tilt: 0, fs: 1, face: 1, nib: 0, cool: 0, stam: 1, ra: 0, runT: 0, surge: 0, fx: 1, fy: 0, pull: 0, ang: 0, bubT: rand(1, 5), jump: 0, jumpCD: 2, golden: !sp.boss && Math.random() < 0.08 };
}
function spawnFish(offscreen) {
  const f = makeFish(pickSpecies()), sp = SP[f.sp];
  pickTarget(f);
  if (offscreen && !isRiver()) { f.x = VW + 40; f.y = f.ty; } else { f.x = rand(SHORE + 120, fishXMax()); f.y = clamp(SURF + rand(sp.d[0], sp.d[1]) * PX, SURF + 14, bottomAt(f.x) - 10); }
  f.fs = f.tx > f.x ? 1 : -1;
  fishes.push(f);
}
function releaseFish(f, flee) {
  if (engaged === f) engaged = null;
  f.st = 'flee'; f.t = flee ? 1.6 : 0.6; f.cool = flee ? 5 : 2.5; f.jump = 0;
  f.tx = clamp(f.x + rand(180, 320) * (Math.random() < 0.5 ? -1 : 1), SHORE + 120, fishXMax());
  f.ty = clamp(f.y + rand(-60, 80), SURF + 14, bottomAt(f.tx) - 10);
}
function steer(f, vx, vy, dt, k) {
  f.vx += (vx - f.vx) * Math.min(1, dt * k);
  f.vy += (vy - f.vy) * Math.min(1, dt * k);
  f.x += f.vx * dt; f.y += f.vy * dt;
}
function hookSettled() {
  const v = vel(hook);
  return Math.hypot(v.x - flow() * 0.6, v.y) < 60 && (Math.abs(leader - depth * PX) < 8 || hook.y >= bottomAt(hook.x) - 5);
}

function updateFish(dt) {
  for (const f of fishes) {
    const sp = SP[f.sp];
    if (f.golden && Math.random() < dt * 6) sparks.push({ x: f.x + rand(-f.len / 2, f.len / 2), y: f.y + rand(-8, 8), t: 0 });
    if (f === hooked) {
      f.ph += dt * (7 + 10 * f.stam);
      f.fs = Math.cos(f.ang) >= 0 ? 1 : -1;
      f.tilt = Math.atan2(Math.sin(f.ang), Math.abs(Math.cos(f.ang)));
      f.x = hook.x - f.fs * Math.cos(f.tilt) * f.len * 0.46; f.y = hook.y - Math.sin(f.tilt) * f.len * 0.46; f.vx = f.vy = 0;
      continue;
    }
    if (f.cool > 0) f.cool -= dt;
    f.ph += dt * (3 + Math.hypot(f.vx, f.vy) * 0.06);
    if ((f.bubT -= dt) <= 0) { f.bubT = rand(2, 7); bubbles.push({ x: f.x + f.fs * f.len * 0.45, y: f.y, r: rand(1, 2.4), p: rand(0, 6) }); }

    if (f.st === 'swim' || f.st === 'flee') {
      if (f.st === 'flee' && (f.t -= dt) <= 0) f.st = 'swim';
      const dx = f.tx - f.x, dy = f.ty - f.y, d = Math.hypot(dx, dy) || 1;
      if (d < 20) pickTarget(f);
      const spd = sp.speed * (f.st === 'flee' ? 2.6 : 1) * (0.75 + 0.25 * Math.sin(f.ph * 0.13));
      steer(f, dx / d * spd, dy / d * spd, dt, f.st === 'flee' ? 4 : 1.3);
      if (f.st === 'swim' && !engaged && st === 'water' && bait && !junk && sinceLand > 0.8 && f.cool <= 0 && hookSettled()) {
        const hd = (hook.y - SURF) / PX, md = Math.hypot(hook.x - f.x, hook.y - f.y);
        const localD = (bottomAt(hook.x) - SURF) / PX, d1 = Math.min(sp.d[1], localD), d0 = Math.min(sp.d[0], localD - 1);
        if (md < 340 && hd > d0 - 1.4 && hd < d1 + 1.4 && Math.random() < dt * sp.app * 1.3 * (1 + 0.35 * tier('bait')) * (1 + stormK) * (1 - md / 340)) {
          f.st = 'approach'; engaged = f; f.face = hook.x >= f.x ? 1 : -1;
        }
      }
    } else if (f.st === 'approach') {
      if (st !== 'water' || !bait) { releaseFish(f, false); continue; }
      f.face = hook.x >= f.x ? 1 : -1;
      const tx = hook.x - f.face * f.len * 0.48, ty = hook.y;
      const dx = tx - f.x, dy = ty - f.y, d = Math.hypot(dx, dy) || 1;
      steer(f, dx / d * Math.min(75, d * 3), dy / d * Math.min(75, d * 3), dt, 3);
      if (d < 6) { f.st = 'nibble'; f.nib = Math.round(rand(sp.nib[0], sp.nib[1])); f.t = rand(0.3, 0.7); }
    } else if (f.st === 'nibble' || f.st === 'bite') {
      if (st !== 'water') { releaseFish(f, false); continue; }
      f.x = hook.x - f.face * f.len * 0.48; f.y = hook.y; f.vx = f.face * 2; f.vy = 0;
      f.t -= dt;
      if (f.st === 'nibble' && f.t <= 0) {
        if (f.nib > 0) {
          f.nib--; f.t = rand(0.3, 0.65);
          addVel(hook, -f.face * rand(10, 30), rand(80, 130));
          ripples.push({ x: bob.x, r: 4, a: 0.5 }); sfx.tick();
        } else {
          f.st = 'bite'; f.t = sp.bite * 1.7 * (1 + 0.15 * tier('bait'));
          ripples.push({ x: bob.x, r: 6, a: 0.9 }, { x: bob.x, r: 2, a: 0.7 }); sfx.plop(); addShake(3);
        }
      } else if (f.st === 'bite' && f.t <= 0) {
        if (Math.random() < 0.25) { bait = false; toast('הפיתיון נגנב', 1700, 'bad'); }
        else toast('פספסתם את הנגיסה', 1500, 'bad');
        releaseFish(f, true);
      }
    }
    if (f.st !== 'nibble' && f.st !== 'bite') f.x += flow() * 0.15 * dt;
    f.x = Math.min(f.x, Math.min(VW, farX) - 20);
    f.y = clamp(f.y, surfAt(f.x) + 10, bottomAt(f.x) - 6);
    if (Math.abs(f.vx) > 6) f.fs += (Math.sign(f.vx) - f.fs) * Math.min(1, dt * 5);
    if (f.st === 'nibble' || f.st === 'bite') { f.fs += (f.face - f.fs) * Math.min(1, dt * 8); }
    const tt = f.st === 'bite' ? 0.35 : clamp(Math.atan2(f.vy, Math.abs(f.vx) + 1), -0.5, 0.5);
    f.tilt += (tt - f.tilt) * Math.min(1, dt * 4);
  }
  if (fishes.length < 10 && (spawnT -= dt) <= 0) { spawnFish(true); spawnT = rand(1.5, 4); }
}

function hookFish(f) {
  engaged = null; hooked = f; f.st = 'hooked'; f.stam = 1; f.runT = 0; f.jump = 0; f.jumpCD = rand(1.2, 3);
  hook.w = 1 / (0.03 + f.kg);
  L = dist(tip, hook) + 2;
  st = 'hooked'; overT = 0; slackT = 0; fightT = 0;
  f.ang = Math.atan2(hook.y - tip.y, hook.x - tip.x);
  if (SP[f.sp].teeth) { toast(`${SP[f.sp].name}!`, 1400, 'bad'); addShake(SP[f.sp].boss ? 10 : 5); }
  else if (f.golden) toast('דג זהב!', 1300, 'gold');
  splash(hook.x, 0.7); sfx.splash(0.6); addShake(4);
}
function fightAI(dt) {
  const f = hooked, sp = SP[f.sp];
  fightT += dt;
  const v = vel(hook), s = surfAt(hook.x), b = bottomAt(hook.x);
  const turn = a => { const d = ((a - f.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI; f.ang += d * Math.min(1, dt * 6); };

  if (f.jump === 2) { // airborne
    f.airT = (f.airT || 0) + dt;
    f.ang = Math.atan2(v.y, v.x) + Math.sin(time * 25) * 0.4;
    if (pressed) overT += dt * 0.5;            // head shake on a tight line
    if (Math.random() < dt * 40) drops.push({ x: hook.x + rand(-10, 10), y: hook.y, vx: rand(-60, 60), vy: rand(-40, 40), l: 0.6, r: rand(1, 2) });
    if ((hook.y > s + 4 && v.y > 0) || f.airT > 2.5) { f.jump = 0; f.airT = 0; splash(hook.x, 1.4); sfx.splash(1); addShake(6); }
    return;
  }
  if (f.jump === 0 && sp.jump > 0 && (f.jumpCD -= dt) <= 0) {
    f.jumpCD = rand(2.5, 5.5);
    if (Math.random() < sp.jump && hook.y - s < 220 && f.stam > 0.25) f.jump = 1;
  }
  if (f.jump === 1) { // rush for the surface
    f.fx = clamp(f.fx, -0.4, 0.4); f.fy = -1; const n = Math.hypot(f.fx, f.fy); f.fx /= n; f.fy /= n;
    f.pull = f.kg * 3.2;
    turn(Math.atan2(f.fy, f.fx));
    if (hook.y < s - 2) { f.jump = 2; f.airT = 0; setVel(hook, v.x * 0.5 + f.fx * 60, -rand(230, 330)); splash(hook.x, 1); sfx.splash(0.8); addShake(4); }
    return;
  }

  if ((f.runT -= dt) <= 0) {
    const away = Math.atan2(hook.y - tip.y, hook.x - tip.x);
    f.toward = Math.random() < 0.12;
    f.ra = f.toward ? away + Math.PI + rand(-0.4, 0.4) : away + (sp.teeth || sp.rocks ? rand(-0.2, 1.2) : rand(-1.1, 1.1));
    f.runT = rand(0.8, 2.2);
    f.surge = Math.random() < 0.28 * f.stam + 0.05 ? rand(0.5, 1.1) : 0;
    if (f.surge && f.kg > 3) addShake(3);
  }
  if (f.surge > 0) f.surge -= dt;

  if (b - hook.y < 25) dy = Math.min(dy, -0.4);
  if (hook.x > Math.min(VW, farX) - 90) dx = Math.min(dx, -0.3);
  if (hook.x < SHORE + 40) dx = Math.max(dx, 0.5);

  f.fx = dx / n; f.fy = dy / n;
  f.pull = f.kg * sp.str * (0.08 + 1.0 * f.stam) * (f.surge > 0 ? 1.6 : 1) * (f.toward ? 0.5 : 1);

}

/* ---------- the predator: a boss that swallows a small hooked fish ---------- */
function maybePredator(dt) {
  if (predCD > 0) predCD -= dt;
  if (!LV.pred || pred || !hooked || SP[hooked.sp].boss || hooked.kg > 3 || fightT < 2 || predCD > 0) return;
  if (Math.random() < dt * LV.pred) {
    const g = makeFish(LOC.pred);
    const fromRight = hook.x < Math.min(VW, farX) * 0.6 && !isRiver();
    pred = { f: g, x: fromRight ? VW + 120 : hook.x + rand(-80, 80), y: fromRight ? clamp(hook.y + 60, SURF + 30, bottomAt(VW - 40) - 20) : bottomAt(hook.x) - 20, st: 'warn', t: 1.6, fs: fromRight ? -1 : 1, tilt: 0 };
    g.x = pred.x; g.y = pred.y;
    toast('טורף!', 1200, 'bad'); sfx.alarm(); predCD = 25;
  }
}
function updatePred(dt) {
  if (!pred) return;
  const p = pred, f = p.f;
  f.ph += dt * 8;
  if (!hooked || p.st === 'leave') {
    p.st = 'leave';
    p.x += 220 * dt; p.fs += (1 - p.fs) * Math.min(1, dt * 6); p.tilt = 0;
    if (p.x > VW + 220) pred = null;
    return;
  }
  const mx = hook.x - p.fs * f.len * 0.48, my = hook.y;
  const dx = mx - p.x, dy = my - p.y, d = Math.hypot(dx, dy) || 1;
  const spd = p.st === 'warn' ? 110 : 420;
  p.x += dx / d * Math.min(spd * dt, d); p.y += dy / d * Math.min(spd * dt, d);
  p.fs += ((hook.x >= p.x ? 1 : -1) - p.fs) * Math.min(1, dt * 6);
  p.tilt = clamp(Math.atan2(dy, Math.abs(dx) + 1), -0.6, 0.6);
  if (p.st === 'warn' && (p.t -= dt) <= 0) p.st = 'charge';
  if (p.st === 'charge' && d < 14) {
    const old = hooked;
    fishes = fishes.filter(x => x !== old);
    f.st = 'hooked'; f.stam = 1; f.runT = 1.4; f.surge = 1.4; f.jump = 0;
    f.ra = Math.atan2(hook.y - tip.y, hook.x - tip.x) + 0.5; f.ang = f.ra;
    fishes.push(f); hooked = f; hook.w = 1 / (0.03 + f.kg);
    for (let i = 0; i < 24; i++) bubbles.push({ x: hook.x + rand(-30, 30), y: hook.y + rand(-20, 20), r: rand(1.5, 4), p: rand(0, 6) });
    toast(`${SP[f.sp].name}!`, 1400, 'bad');
    addShake(14); flash = 0.35; sfx.chomp(); pred = null; fightT = 0;
  }
}

/* ---------- school of small fish ---------- */
function buildSchool() {
  school = [];
  for (let i = 0; i < 26; i++) school.push({ ox: rand(-50, 50), oy: rand(-14, 14), x: SHORE + 400 + rand(-50, 50), y: SURF + 40 + rand(-10, 10), vx: 0, vy: 0, sc: 0, p: rand(0, 6) });
}
function updateSchool(dt) {
  const lx = SHORE + 320 + (fishXMax() - SHORE - 400) * (0.5 + 0.5 * Math.sin(time * 0.09));
  const ly = SURF + Math.min(55, (BED - SURF) * 0.4) + 20 * Math.sin(time * 0.37);
  for (const m of school) {
    m.p += dt * 12;
    if (m.sc > 0) m.sc -= dt;
    else {
      const tx = lx + m.ox + Math.sin(time * 1.3 + m.p * 0.1) * 10, ty = ly + m.oy;
      m.vx += ((tx - m.x) * 1.4 - m.vx) * Math.min(1, dt * 1.6);
      m.vy += ((ty - m.y) * 1.4 - m.vy) * Math.min(1, dt * 1.6);
    }
    m.x += m.vx * dt; m.y += m.vy * dt;
    m.y = clamp(m.y, surfAt(m.x) + 6, bottomAt(m.x) - 6);
  }
}
function scatter(x, y, r) {
  for (const m of school) {
    const dx = m.x - x, dy = m.y - y, d = Math.hypot(dx, dy);
    if (d < r) { m.vx = dx / (d || 1) * rand(200, 320); m.vy = dy / (d || 1) * rand(120, 240); m.sc = rand(0.8, 1.4); }
  }
}

/* ---------- cormorant ---------- */
function updateCorm(dt) {
  const c = corm;
  c.p += dt * (c.st === 'dive' ? 2 : 12);
  if (c.st === 'off') { if (st !== 'menu' && (c.t -= dt) <= 0) { c.st = 'in'; c.x = -60; c.y = SURF * 0.3; c.tx = rand(SHORE + 260, fishXMax() - 60); c.fish = false; } return; }
  if (c.st === 'in') { c.x += 230 * dt; c.y += Math.sin(time * 2) * 10 * dt; c.rot = 0; if (c.x >= c.tx) { c.st = 'dive'; c.vx = 90; c.vy = 0; } }
  else if (c.st === 'dive') { c.vy += 900 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.rot = Math.atan2(c.vy, c.vx); if (c.y > surfAt(c.x)) { c.st = 'under'; c.t = 1.3; splash(c.x, 1); sfx.splash(0.7); for (const f of fishes) if (f !== hooked && f !== engaged && Math.hypot(f.x - c.x, f.y - c.y) < 160) releaseFish(f, true); } }
  else if (c.st === 'under') { c.t -= dt; c.x += 120 * dt; c.y = lerp(c.y, Math.min(SURF + 70, BED - 20), dt * 3); c.rot = 0.2; if (c.t <= 0) { c.st = 'up'; c.fish = Math.random() < 0.7; splash(c.x, 0.6); c.vy = -260; } }
  else if (c.st === 'up') { c.x += 210 * dt; c.vy = Math.min(c.vy + 120 * dt, -60); c.y += c.vy * dt; c.rot = -0.3; if (c.x > VW + 80 || c.y < -60) { c.st = 'off'; c.t = rand(18, 32); } }
}
function drawCorm(under) {
  const c = corm;
  if (c.st === 'off' || (c.st === 'under') !== under) return;
  ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
  ctx.globalAlpha = under ? 0.55 : 1;
  ctx.fillStyle = '#14161b'; ctx.strokeStyle = '#14161b'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.ellipse(0, 0, 17, 6, 0, 0, 7); ctx.fill();
  ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(12, -2); ctx.quadraticCurveTo(20, -4, 22, -9); ctx.stroke();
  ctx.beginPath(); ctx.arc(23, -10, 4, 0, 7); ctx.fill();
  ctx.strokeStyle = '#c9a24a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(26, -10); ctx.lineTo(33, -8); ctx.stroke();
  if (c.fish) { ctx.fillStyle = '#d6dee6'; ctx.beginPath(); ctx.ellipse(33, -6, 5, 2, 0.4, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#14161b'; ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(-25, 3); ctx.lineTo(-15, 3); ctx.fill();
  if (!under && c.st !== 'dive') {
    const fl = Math.sin(c.p) * 14;
    ctx.strokeStyle = '#1d2026'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(-2, -2); ctx.quadraticCurveTo(-10, -12 - fl, -26, -6 - fl * 1.4); ctx.stroke();
  } else if (c.st === 'dive') {
    ctx.strokeStyle = '#1d2026'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(-20, -4); ctx.stroke();
  }
  ctx.restore();
}

/* ---------- input ---------- */
function press() {
  ensureAudio();
  if (st === 'menu') return;
  pressed = true;
  if (st === 'ready') { st = 'charge'; charge = 0; chargeDir = 1; }
  else if (st === 'fly') { if (!flyLock) { flyLock = true; L = dist(tip, bob); sfx.tick(); } }
  else if (st === 'water') {
    addVel(tip, -200, -360);           // strike: snap the rod back
    if (engaged) {
      if (engaged.st === 'bite') hookFish(engaged);
      else if (engaged.st === 'nibble') {
        if (Math.random() < 0.4) hookFish(engaged);
        else { toast('מוקדם מדי', 1100, 'bad'); releaseFish(engaged, true); }
      }
    }
  }
}
function release() {
  pressed = false;
  if (st === 'charge') { st = 'swing'; swingT = 0; castCharge = charge; sfx.swish(); }
}
function cast() {
  const sp = 200 + 400 * castCharge, a = -0.72;
  followT = FOLLOW;
  st = 'fly'; flyLock = false;
  setP(bob, tip.x, tip.y + 4); setP(hook, tip.x, tip.y + 14);
  setVel(bob, sp * Math.cos(a), sp * Math.sin(a)); setVel(hook, sp * Math.cos(a), sp * Math.sin(a));
  L = dist(tip, bob); leader = 12; bait = true; wear = 0; junk = null; junkTried = false;
}

cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.setPointerCapture?.(e.pointerId); press(); });
window.addEventListener('pointerup', () => { if (pressed) release(); });
window.addEventListener('pointercancel', () => { if (pressed) release(); });
window.addEventListener('keydown', e => {
  if (!$('overlay').hidden) return;
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) press(); }
  else if (e.code === 'ArrowUp') { e.preventDefault(); setDepth(depth - 0.5); }
  else if (e.code === 'ArrowDown') { e.preventDefault(); setDepth(depth + 0.5); }
  else if (e.code === 'ArrowRight' || e.code === 'BracketRight') setDrag(drag + 0.5);
  else if (e.code === 'ArrowLeft' || e.code === 'BracketLeft') setDrag(drag - 0.5);
});
window.addEventListener('keyup', e => { if (e.code === 'Space' && pressed) release(); });
cv.addEventListener('wheel', e => { e.preventDefault(); setDrag(drag + (e.deltaY < 0 ? 0.5 : -0.5)); }, { passive: false });
function setDepth(v) { depth = clamp(Math.round(v * 2) / 2, 0.5, Math.max(1, LOC.depth - 0.5)); }
function setDrag(v) { drag = clamp(Math.round(v * 2) / 2, 0.5, Math.round(lineKg * 1.2 * 2) / 2); }
$('dragMinus').onclick = () => setDrag(drag - 0.5);
$('dragPlus').onclick = () => setDrag(drag + 0.5);
$('depMinus').onclick = () => setDepth(depth - 0.5);
$('depPlus').onclick = () => setDepth(depth + 0.5);

const VOICE = {

  oud: { len: 2.4, decay: 0.993, pick: 0.85 },

const hum = () => rand(-0.008, 0.008);

/* ---------- game flow ---------- */
function update(dt) {
  time += dt;
  const u = flow();
  for (const c of clouds) { c.x += (5 + wind * 7) * dt; if (c.x > VW + 200) c.x = -200; if (c.x < -200) c.x = VW + 200; }
  for (const b of birds) { b.x += b.v * dt; b.p += dt * 7; if (b.x > VW + 40) { b.x = -40; b.y = SURF * (0.15 + Math.random() * 0.35); } }
  boatX = (boatX + (6 + wind * 3) * dt + VW + 400) % (VW + 400);
  for (const m of motes) { m.y -= m.s * 4 * dt; m.x += (Math.sin(time * 0.5 + m.p) * 4 + u * 0.7) * dt; if (m.x > farX) m.x = SHORE; if (m.y < SURF + 4) { m.y = BED - 10; } }

  if (st === 'swing' && (swingT += dt) >= SWING) cast();
  if (followT > 0 && st !== 'swing') followT = Math.max(0, followT - dt);
  if (st === 'charge') { charge += chargeDir * dt / 0.85; if (charge >= 1) { charge = 1; chargeDir = -1; } if (charge <= 0) { charge = 0; chargeDir = 1; } }

  const active = st !== 'menu';
  if (active && timeLeft > 0) timeLeft = Math.max(0, timeLeft - dt);

  if (pressed && (st === 'water' || st === 'hooked')) {
    const before = L;
    L = Math.max(st === 'hooked' ? 40 : 60, L - reelSpeed() * dt);
    reelAcc += before - L; reelAng += (before - L) * 0.12;
    if (reelAcc > 10) { reelAcc = 0; sfx.tick(); }
  }
  if (slipAcc > 7) { slipAcc = 0; sfx.zz(); }

  if (st === 'fly') {
    if (bob.x > Math.min(VW, farX) - 70 && !flyLock) { flyLock = true; L = dist(tip, bob); }
    if (bob.x < SHORE && bob.y > SURF - 36) { resetRig(); toast('קצר מדי', 1100, 'bad'); }
    else if (bob.y > surfAt(bob.x) - 3) {
      st = 'water'; sinceLand = 0; L = dist(tip, bob) + 4;
      const v = vel(bob), sp = Math.hypot(v.x, v.y);
      splash(bob.x, Math.min(1.4, sp / 400)); sfx.splash(Math.min(1, sp / 500));
    }
  }
  if (st === 'water') {
    sinceLand += dt;
    const target = L < 220 ? 12 : depth * PX;
    leader += clamp(target - leader, -240 * dt, 200 * dt);
    if (!junk && !junkTried && pressed && !engaged && L > 200 && hook.y >= bottomAt(hook.x) - 6) {
      junkTried = true;
      if (Math.random() < 0.14) { junk = pickJunk(); bait = false; sfx.plop(); }
    }
    if (L <= 95) { st = 'ready'; L = 70; bait = true; leader = 12; if (engaged) releaseFish(engaged, false); if (junk) landJunk(); }
  }
  if (st === 'hooked') {
    fightAI(dt);
    maybePredator(dt);
    const f = hooked;
    if (tension > lineKg) overT += dt; else overT = Math.max(0, overT - dt * 0.6);
    if (overT > 0.35) snapLine('החוט נקרע!');
    else if (wear >= 1) snapLine(SP[f.sp].teeth ? 'השיניים קרעו את החוט!' : 'החוט נשחק על הסלעים!');
    else {
      const d = dist(tip, hook);
      if (d < L - 40) slackT += dt; else slackT = Math.max(0, slackT - dt * 1.5);
      if (slackT > 4) escapeFish();
      else if (hook.x < SHORE + 200 + 50 * tier('net') && hook.y - surfAt(hook.x) < 70 + 20 * tier('net') && f.jump !== 2 && (f.kg < 3 || f.stam < 0.6)) landFish(f);
    }
  }
  updatePred(dt);
  if (st === 'landed') {
    landT += dt;
    if (landT > (pearlFx ? 2.8 : 1.8)) { landed = null; pearlFx = null; st = 'ready'; resetRig(); afterCatch(); }
  }
  if (active && timeLeft <= 0 && (st === 'ready' || st === 'charge' || st === 'swing' || st === 'fly' || st === 'water')) levelFail();

  if (!talk && speech.length) { talk = Object.assign({ t: 0 }, speech.shift()); sfx.voice(); }
  if (talk && (talk.t += dt) > talk.dur) talk = null;
  updateStorm(dt);
  musicTick();
  if (pearlFx) {
    pearlFx.t += dt;
    if (!pearlFx.shown && pearlFx.t > 0.7) {
      pearlFx.shown = true; toast('מרגלית! +400 ₪', 1800, 'gold'); sfx.gold(); flash = Math.max(flash, 0.3);
      for (let i = 0; i < 24; i++) sparks.push({ x: tip.x + rand(-30, 50), y: tip.y + rand(20, 100), t: rand(-0.3, 0) });
    }
  }

  updateFish(dt);
  updateSchool(dt);
  updateCorm(dt);
  if (LOC.scene === 'sea' && (rockSprayT -= dt) <= 0) { rockSprayT = rand(2.5, 6); const x = SHORE + rand(-30, 10); for (let i = 0; i < 18; i++) drops.push({ x: x + rand(-10, 10), y: SURF - 4, vx: rand(-40, 30), vy: rand(-320, -120), l: 1.2, r: rand(1.2, 2.6) }); foam.push({ x, y: SURF, r: 14, a: 0.9 }); }
  for (const b of bubbles) { b.y -= 28 * dt; b.p += dt * 3; b.x += Math.sin(b.p) * 0.3 + u * 0.5 * dt; }
  bubbles = bubbles.filter(b => b.y > surfAt(b.x) + 2);
  for (const d of drops) { d.vy += G * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.l -= dt; }
  drops = drops.filter(d => d.l > 0 && !(d.vy > 0 && d.y > surfAt(d.x) + 2));
  for (const r of ripples) { r.r += 30 * dt; r.a -= 0.55 * dt; r.x += u * dt; }
  ripples = ripples.filter(r => r.a > 0);
  for (const f of foam) { f.r += 20 * dt; f.a -= 0.9 * dt; f.x += u * dt; }
  foam = foam.filter(f => f.a > 0);
  for (const s of sparks) s.t += dt;
  sparks = sparks.filter(s => s.t < 0.6);
  for (const f of floats) { f.t += dt; f.y -= 40 * dt; }
  floats = floats.filter(f => f.t < 1.6);
  for (const b of lostBobs) { b.x += b.vx * dt; b.t -= dt; }
  lostBobs = lostBobs.filter(b => b.t > 0 && b.x < farX);
  if (snapFx && (snapFx.t += dt) > 0.7) snapFx = null;
  if (st === 'water' && Math.random() < dt * 0.4) ripples.push({ x: bob.x, r: 3, a: 0.25 });

  // camera
  let tz = 1, tx = VW / 2, ty = VH / 2;
  if (!RM) {
    if (st === 'hooked') { tz = clamp(VW / (hook.x + 110 - (SHORE - 200)), 1, hooked && SP[hooked.sp].boss ? 1.1 : 1.16); tx = (tip.x + hook.x) / 2; ty = (tip.y + hook.y) / 2 + 30; }
    else if (st === 'landed') { tz = 1.22; tx = tip.x + 20; ty = tip.y + 90; }
    else if (st === 'water' && engaged && engaged.st === 'bite') { tz = clamp(VW / (bob.x + 110 - (SHORE - 200)), 1, 1.08); tx = bob.x; ty = bob.y; }
  }
  cam.z += (tz - cam.z) * Math.min(1, dt * 2.2);
  cam.x += (tx - cam.x) * Math.min(1, dt * 3);
  cam.y += (ty - cam.y) * Math.min(1, dt * 3);
  const hw = VW / (2 * cam.z), hh = VH / (2 * cam.z);
  cam.x = clamp(cam.x, hw, VW - hw); cam.y = clamp(cam.y, hh, VH - hh);
  cam.x = Math.min(cam.x, hw + 10);          // the angler always stays in frame
  shake *= Math.exp(-6 * dt); flash = Math.max(0, flash - dt * 1.5);

  tDisp += (tension - tDisp) * Math.min(1, dt * 10);
  updateHud();
}

function splash(x, s) {
  const y = surfAt(x);
  for (let i = 0; i < 22 * s + 6; i++) drops.push({ x: x + rand(-6, 6) * s, y: y - 2, vx: rand(-130, 130) * s, vy: rand(-360, -90) * s, l: 1.4, r: rand(1.2, 2.8) });
  ripples.push({ x, r: 4, a: 1 }, { x, r: 1, a: 0.8 }, { x, r: 9, a: 0.6 });
  foam.push({ x, y, r: 8 * s, a: 0.9 });
  scatter(x, y + 30, 170 * s);
}
function snapLine(msg) {
  const f = hooked; hooked = null; f.st = 'swim'; f.jump = 0; releaseFish(f, true);
  snapFx = { t: 0, ang: Math.atan2(hook.y - tip.y, hook.x - tip.x), len: Math.min(320, dist(tip, hook)) };
  if (bob.y > SURF - 30) lostBobs.push({ x: bob.x, vx: wind * 8 + flow() * 0.8 + rand(4, 14), t: 7 });
  sfx.snap(); toast(msg, 2000, 'bad'); addShake(12); flash = 0.25;
  combo = 1; bumpCombo();
  st = 'ready'; resetRig();
}

  if (st !== 'landed') {
    if (hooked) drawLine(tip.x, tip.y, hook.x, hook.y, L - dist(tip, hook));
    else { drawLine(tip.x, tip.y, bob.x, bob.y - 8, st === 'fly' ? 0 : L - dist(tip, bob)); drawHook(); if (junk) drawJunk(hook.x, hook.y + 8); }
    const v = vel(bob), tilt = hooked ? Math.atan2(tip.x - hook.x, hook.y - tip.y) * 0.5 : clamp((v.x - flow()) * 0.002, -0.5, 0.5);
    drawBobber(bob.x, bob.y, tilt);
    if (engaged && engaged.st === 'bite') {
      const k = (time * 2) % 1;
      ctx.strokeStyle = `rgba(255,233,168,${1 - k})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(bob.x, surfAt(bob.x), 10 + k * 40, (10 + k * 40) * 0.3, 0, 0, 7); ctx.stroke();
      ctx.fillStyle = '#ffe9a8'; ctx.font = '800 34px Assistant, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('!', bob.x, bob.y - 42 - Math.abs(Math.sin(time * 12)) * 8);
    }
  }
  for (const b of lostBobs) { ctx.save(); ctx.globalAlpha = Math.min(1, b.t / 2); drawBobber(b.x, surfAt(b.x) + 3, Math.sin(time * 2 + b.x) * 0.2); ctx.restore(); }
  if (snapFx) {
    const k = snapFx.t / 0.7, len = snapFx.len * Math.pow(1 - k, 2);
    const a = lerp(snapFx.ang, -2.4, k);
    ctx.strokeStyle = `rgba(255,140,120,${1 - k})`; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(tip.x, tip.y);
    for (let i = 1; i <= 14; i++) { const t = i / 14, w = Math.sin(t * 12 + snapFx.t * 40) * 14 * (1 - k) * t; ctx.lineTo(tip.x + Math.cos(a) * len * t - Math.sin(a) * w, tip.y + Math.sin(a) * len * t + Math.cos(a) * w); }
    ctx.stroke();
  }
  drawPier();
  drawAngler();
  drawCorm(false);
  if (st === 'landed' && landed) {
    const sw = Math.sin(time * 9) * 0.35;
    ctx.strokeStyle = 'rgba(240,238,228,.75)'; ctx.lineWidth = 1.1; ctx.beginPath(); ctx.moveTo(tip.x, tip.y); ctx.lineTo(tip.x + Math.sin(sw) * 16, tip.y + 16); ctx.stroke();
    drawFishFast(landed.sp, landed.len, tip.x + Math.sin(sw) * (16 + landed.len * 0.5), tip.y + 16 + landed.len * 0.48, -Math.PI / 2 + sw, 1, time * 20, landed.golden);
    if (netGrip) paintNet(ctx, netGrip.x, netGrip.y, tip.x + Math.sin(sw) * (16 + landed.len * 0.5), tip.y + 16 + landed.len * 0.82, tier('net'));
    if (pearlFx && pearlFx.t > 0.5) drawPearl(tip.x + Math.sin(sw) * (16 + landed.len * 0.5) + 16, tip.y + 16 + landed.len * 0.6 - Math.min(1, (pearlFx.t - 0.5) * 2) * 46);
  }
  ctx.strokeStyle = 'rgba(225,242,255,.85)'; ctx.lineCap = 'round';
  for (const d of drops) { ctx.lineWidth = d.r; ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.vx * 0.018, d.y - d.vy * 0.018); ctx.stroke(); }

  if (st === 'charge') {
    const x = SHORE - 160, y = SURF - 190, h = 90;
    ctx.fillStyle = 'rgba(10,20,34,.6)'; ctx.fillRect(x, y, 12, h);
    const g = ctx.createLinearGradient(0, y + h, 0, y); g.addColorStop(0, '#f3ead6'); g.addColorStop(1, '#ff5a36');
    ctx.fillStyle = g; ctx.fillRect(x + 2, y + h - (h - 4) * charge - 2, 8, (h - 4) * charge);
  }
  if (pal.shade) { ctx.fillStyle = `rgba(4,8,26,${pal.shade})`; ctx.fillRect(-M, -M, VW + 2 * M, VH + 2 * M); }
  if (stormK > 0.01) { ctx.fillStyle = `rgba(18,24,38,${0.4 * stormK})`; ctx.fillRect(-M, -M, VW + 2 * M, VH + 2 * M); }

  ctx.globalCompositeOperation = 'lighter';
  if (pal.stars) {
    glow(SHORE - 30, SURF - 41, 80, [255, 190, 90], 0.35);
    if (LOC.scene === 'yarkon') { ctx.fillStyle = 'rgba(255,215,140,.55)'; for (const w of windows) ctx.fillRect(w[0], w[1], 2.5, 3); }
    else if (LOC.scene === 'sea') { glow(VW * 0.86, SURF - 6, 10, [255, 120, 90], 0.6 + 0.4 * Math.sin(time * 3)); }
    else for (const v of villages) glow(v.x, v.y, 6, [255, 200, 120], 0.5 + 0.3 * Math.sin(time * 3 + v.p));
    for (const f of fireflies) { const fx = f.x + Math.sin(time * 0.6 + f.p) * 30, fy = f.y + Math.cos(time * 0.8 + f.p) * 16; glow(fx, fy, 8, [190, 255, 120], 0.35 + 0.35 * Math.sin(time * 4 + f.p)); }
    if (st !== 'landed') glow(bob.x, bob.y - 24, 20, [140, 255, 110], 0.7);
  }
  for (const s of sparks) {
    if (s.t < 0) continue;
    const a = 1 - s.t / 0.6, r = 4 * a;
    ctx.fillStyle = `rgba(255,225,130,${a})`;
    ctx.fillRect(s.x - r, s.y - 0.6, r * 2, 1.2); ctx.fillRect(s.x - 0.6, s.y - r, 1.2, r * 2);
  }
  ctx.globalCompositeOperation = 'source-over';

  drawSpeech();
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.direction = 'ltr';
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, 1.6 - f.t);
    ctx.font = `${f.big ? 40 : 28}px "Suez One", Georgia, serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(10,20,34,.7)'; ctx.strokeText(f.txt, f.x, f.y);
    ctx.fillStyle = f.c; ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawRain();
  let g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.38)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const danger = st === 'hooked' ? Math.max(clamp((tDisp / lineKg - 0.8) * 4, 0, 1), clamp((wear - 0.7) * 3, 0, 1), pred ? 0.6 : 0) : 0;
  if (danger > 0) {
    g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, 'rgba(255,40,30,0)'); g.addColorStop(1, `rgba(255,40,30,${danger * (0.25 + 0.15 * Math.sin(time * 14))})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }
}

/* ---------- loop & boot ---------- */
let last = performance.now(), acc = 0;
let slowT = 0;
function frame(now) {
  const raw = (now - last) / 1000;
  const dt = Math.min(0.05, raw); last = now;
  if (raw > 0.026 && raw < 0.5) slowT += raw; else slowT = Math.max(0, slowT - raw * 0.5);
  if (slowT > 2 && dprCap > 1) { dprCap = Math.max(1, dprCap - 0.25); slowT = 0; resize(); }
  if (paused) { musicTick(); acc = 0; }
  else {
    acc += dt;
    while (acc >= DT) { step(DT); acc -= DT; }
    update(dt);
  }
  render();
  requestAnimationFrame(frame);
}
function boot(data) {
  loadWallet();
  resize();
  window.addEventListener('resize', resize);
  prepLevel(0);
  if (data && data.locId && LOCS[data.locId]) {
    setLocation(data.locId);
    totalKg = data.totalKg || 0; totalCount = data.totalCount || 0; best = data.best || null; score = data.score || 0;
    showLevelIntro(Math.min(data.levelIdx || 0, LOCS[data.locId].levels.length - 1));
  } else showMap();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
}
if (window.claude?.hot?.snapshot) window.claude.hot.snapshot(() => ({ locId, levelIdx, totalKg, totalCount, best, score }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
</body>
